name: checks
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e '.[dev,quantum,report]'
      - run: ruff format --check .
      - run: ruff check .
      - run: pytest
      - run: qaa-benchmark --output results/smoke.json
      - run: python -m qaa.benchmarks.discrete_expectation --output results/discrete.json
      - run: python -m qaa.benchmarks.oracle_cost --sizes 2 4 --powers 0 1 --with-estimation --output results/oracle-cost.json
      - run: python -m qaa.benchmarks.statistical_study run --probabilities 0.3 --epsilons 0.1 --replications 2 --output results/statistical-pilot
      - run: python -m qaa.benchmarks.statistical_study analyze results/statistical-pilot
      - run: python -m qaa.benchmarks.scientific_report results/statistical-pilot --oracle-study results/oracle-cost.json --output results/scientific-report
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ matrix.python }}
          # The source inventory includes .gitignore and .github workflow files.
          include-hidden-files: true
          path: |
            results/*.json
            results/statistical-pilot/
            results/scientific-report/
  classical-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev,report]'
      - run: pytest
      - run: qaa-benchmark --output results/classical.json
      - run: python -m qaa.benchmarks.discrete_expectation --output results/discrete-classical.json
      - run: python -m qaa.benchmarks.oracle_cost --sizes 2 --output results/oracle-unavailable.json
      - run: python -m qaa.benchmarks.statistical_study run --probabilities 0.3 --epsilons 0.1 --replications 2 --classical-only --output results/statistical-classical
      - run: python -m qaa.benchmarks.scientific_report results/statistical-classical --output results/scientific-classical-report
