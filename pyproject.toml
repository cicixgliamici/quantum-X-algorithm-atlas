[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-algorithm-atlas"
version = "0.1.0"
description = "Reproducible classical and quantum algorithm case studies"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["numpy>=2.2,<3"]

[project.optional-dependencies]
quantum = ["qiskit>=2.1,<3", "qiskit-algorithms>=0.4,<0.5"]
report = ["matplotlib>=3.10,<4"]
dev = ["pytest>=8,<10", "ruff>=0.14,<0.15"]

[project.scripts]
qaa-benchmark = "qaa.benchmarks.monte_carlo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
